apiVersion: wdf.7sg.ai/v2
kind: WorkloadDefinition
metadata:
  name: adk-samples-v2
  description: >
    Agent Development Kit (ADK) sample agents (Python). Deploys the ADK web UI
    serving the sample agents on GCP Cloud Run, backed by Vertex AI Gemini.
  tags:
    env: dev
  labels:
    app: adk-samples
    framework: google-adk
  annotations:
    sherpa.7sg.ai/origin: adk-samples
  version: "0.1.0"

source:
  repo: https://github.com/7sg-ai/adk-samples
  branch: 7sg/sherpa
  path: python/agents

security:
  policies:
    secretsInEnvAllowed: true

secrets:
  provider: external-secrets
  secretRefs:
    - name: google-cloud-project
      injectAs: env
      envVar: GOOGLE_CLOUD_PROJECT
      externalRef:
        provider: vault
        key: secret/adk-samples/gcp/project
    - name: google-cloud-location
      injectAs: env
      envVar: GOOGLE_CLOUD_LOCATION
      externalRef:
        provider: vault
        key: secret/adk-samples/gcp/location
    - name: google-api-key
      injectAs: env
      envVar: GOOGLE_API_KEY
      externalRef:
        provider: vault
        key: secret/adk-samples/gcp/api-key

dataSources:
  inputs: []
  outputs: []

scenarios:
  native:
    description: >
      GCP-native deployment: ADK web UI on Cloud Run with Vertex AI Gemini
      backing the sample agents.
    topology:
      components:
        - name: adk-samples-web
          role: api
          runtime:
            platform: serverless
            regions:
              - us-central1
            image:
              repository: adk-samples
              tag: latest
            env:
              - name: GOOGLE_GENAI_USE_VERTEXAI
                value: "true"
              - name: PORT
                value: "8000"
              - name: LOG_LEVEL
                value: INFO
            envFromSecretRefs:
              - google-cloud-project
              - google-cloud-location
            resources:
              cpu: "2"
              memory: 2Gi
            autoscaling:
              minReplicas: 1
              maxReplicas: 5
              policy:
                metric: cpu
                target: 70
          endpoints:
            - name: http
              port: 8000
              exposure: public
              protocol: http
              path: /
    deployments:
      - name: gcp-us-central
        target:
          provider: gcp
          region: us-central1
          tdfRef: adk-samples-gcp-us-central-v2
        components:
          - adk-samples-web

  alternates:
    - name: local-dev
      description: >
        Local development using a Gemini API key (no Vertex AI), via the ADK CLI.
      topology:
        components:
          - name: adk-samples-web
            role: api
            runtime:
              platform: custom
              regions:
                - local
              image:
                repository: adk-samples
                tag: dev
              env:
                - name: GOOGLE_GENAI_USE_VERTEXAI
                  value: "false"
                - name: PORT
                  value: "8000"
              envFromSecretRefs:
                - google-api-key
              resources:
                cpu: "1"
                memory: 1Gi
              autoscaling:
                minReplicas: 1
                maxReplicas: 1
            endpoints:
              - name: http
                port: 8000
                exposure: public
                protocol: http
                path: /
      deployments:
        - name: local
          target:
            provider: onprem
            region: local
          components:
            - adk-samples-web
